<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- GutMap logo: stylized gut path forming an upward map route -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="#081512"/>
  <!-- winding gut pathway -->
  <path d="M58 150 C 40 128, 88 118, 74 96 C 62 78, 100 74, 96 58 C 93 44, 104 40, 112 44"
        fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round"/>
  <!-- route pins -->
  <circle cx="58" cy="150" r="10" fill="#a3e635"/>
  <circle cx="112" cy="44" r="10" fill="url(#gold)"/>
  <!-- destination flag -->
  <path d="M112 34 l22 8 -22 8 z" fill="#fbbf24"/>
  <!-- label -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="17" fill="#eafff7" letter-spacing="2">GUTMAP</text>
</svg>
